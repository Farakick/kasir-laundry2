<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Struk Arie Loundry</title>
    
    <style>
        :root { --primary: #4a90e2; --bg: #f4f7f6; --danger: #e74c3c; --success: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 20px; }
        
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; margin-top: 0; color: #333; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 0.9em; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        /* SEMBUNYIKAN BOX MANUAL SAAT AWAL */
        #box-manual { display: none; margin-top: 5px; }
        
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }

        .btn-add { background-color: var(--success); color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .cart-table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 0.9em; }
        .cart-table th { text-align: left; border-bottom: 2px solid #eee; padding: 5px; color: #888; }
        .cart-table td { border-bottom: 1px solid #eee; padding: 8px 5px; }
        .btn-del { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }

        .summary-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px dashed #ccc; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9em; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 10px; border-top: 2px solid #ddd; padding-top: 10px; font-weight: bold; font-size: 1.2em; color: var(--primary); }

        .btn-print { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background-color: var(--primary); color: white; font-size: 16px; margin-top: 20px; }
        #statusMsg { text-align: center; font-size: 12px; color: green; display: none; margin-top: 10px; }

        /* --- PERBAIKAN STRUK PRINT AGAR DI TENGAH --- */
        #printableArea { display: none; }
        @media print {
            @page { margin: 0; }
            body * { visibility: hidden; }
            .container { display: none; }
            #printableArea, #printableArea * { visibility: visible; }
            #struk-nama {
                font-weight: bold;
                font-size: 18px; /* Opsional: sedikit lebih besar dari teks lain */
                text-transform: uppercase; /* Opsional: membuat nama jadi huruf besar semua */
            }
            #printableArea { 
                display: block; 
                position: absolute; 
                left: 50%; 
                transform: translateX(-50%); /* Mengetengahkan area struk */
                top: 0; 
                width: 58mm; 
                padding: 10px; /* Jarak agar tidak mepet pinggir kertas */
                font-family: 'Courier New', monospace; 
                font-size: 15px; 
                color: black; 
                box-sizing: border-box;
            }
            .text-center { text-align: center; }
            .struk-item { margin-bottom: 5px; border-bottom: 1px dashed #000; padding-bottom: 2px; }
            .flex-between { display: flex; justify-content: space-between; }
            .bold { font-weight: bold; }
            .hr-dashed { border-bottom: 1px dashed black; margin: 5px 0; }
            .note-area { 
                margin-top: 10px; 
                border: 1px dashed black; 
                padding: 8px; 
                font-size: 18px; /* Ukuran teks catatan di struk diperbesar */
                font-weight: bold;
                line-height: 1.4;
                word-wrap: break-word; 
                background-color: #eee; /* Memberi sedikit warna abu agar terlihat beda */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🧺 Cetak Struk Arie Loundry</h2>

        <div class="form-group">
            <label>Nama Pelanggan</label>
            <input type="text" id="nama" placeholder="Nama Pelanggan...">
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">

        <div style="background: #f0f8ff; padding: 15px; border-radius: 8px;">
            <div class="form-group">
                <label>Pilih Layanan</label>
                <select id="inputLayanan" onchange="cekLayanan()">
                    <option value="Cuci + Setrrika (Kg)">Cuci + Setrrika (Kg)</option>
                    <option value="Setrika">Setrika Saja (Kg)</option>
                    <option value="Bed Cover">Bed Cover (Pcs)</option>
                    <option value="Sprei">Sprei (Pcs)</option>
                    <option value="Permadani">Permadani (Pcs)</option>
                    <option value="Jaket">Jaket (Pcs)</option>
                    <option value="Boneka">Boneka (Pcs)</option>
                    <option value="Lainnya">Lainnya (Tulis Sendiri) ✏️</option>
                </select>

                <div id="box-manual">
                    <input type="text" id="nama-manual" placeholder="Tulis nama barang disini...">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Qty / Berat</label>
                    <input type="number" id="inputQty" value="1">
                </div>
                <div class="col">
                    <label>Harga Satuan</label>
                    <input type="number" id="inputHarga" value="5000">
                </div>
            </div>
            <button class="btn-add" onclick="tambahItem()">+ Tambah ke Daftar</button>
        </div>

        <table class="cart-table">
            <thead>
                <tr>
                    <th>Layanan</th>
                    <th style="text-align:center;">Qty</th>
                    <th style="text-align:right;">Total</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="cartBody"></tbody>
        </table>

        <div class="summary-box">
            <div class="summary-row">
                <span>Subtotal:</span>
                <span id="txtSubtotal">Rp 0</span>
            </div>
            
            <div class="summary-row" style="align-items: center;">
                <span>Deposit (DP):</span>
                <input type="number" id="inputDeposit" placeholder="0" oninput="hitungTotalAkhir()" style="width: 100px; padding: 5px; text-align: right; border: 1px solid #ddd;">
            </div>

            <div class="summary-row" style="align-items: center;">
                <span>Utang/Kurang:</span>
                <input type="number" id="inputUtang" placeholder="0" oninput="hitungTotalAkhir()" style="width: 100px; padding: 5px; text-align: right; border: 1px solid #ddd; color: #e74c3c;">
            </div>

            <div class="summary-total">
                <span>Sisa Bayar:</span>
                <span id="txtTotalAkhir">Rp 0</span>
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label>Catatan / Keterangan (Opsional)</label>
            <textarea id="inputNote" rows="2" placeholder="Contoh: Jangan disetrika licin, Luntur, dll..."></textarea>
        </div>

        <button class="btn-print" id="btnCetak" onclick="prosesTransaksi()">🖨️ Cetak Struk & Simpan</button>
        <p id="statusMsg">✅ Data tersimpan!</p>
    </div>

    <div id="printableArea">
        <div class="text-center">
            <h3 style="margin:0;">Arie Loundry</h3>
            <p style="margin:2px 0;">Graha Surya Indah BLK J.05<br>WA: 0877-8438-8434</p>
            <div class="hr-dashed"></div>
        </div>
        
        <div style="font-size: 10px; margin-bottom: 5px;">
            <div id="struk-date"></div>
            <div>Plg: <b id="struk-nama"></b></div>
        </div>

        <div class="hr-dashed"></div>

        <div id="struk-items-container"></div>

        <div class="flex-between">
            <span>Subtotal:</span>
            <span id="struk-subtotal"></span>
        </div>
        
        <div class="flex-between" id="row-dp-struk" style="display:none;">
            <span>Deposit:</span>
            <span id="struk-dp"></span>
        </div>

        <div class="flex-between" id="row-utang-struk" style="display:none;">
            <span>Utang/Kurang:</span>
            <span id="struk-utang"></span>
        </div>

        <div class="flex-between bold" style="margin-top: 5px; font-size: 13px;">
            <span>TOTAL:</span>
            <span id="struk-grand-total"></span>
        </div>

        <div id="struk-note-area" style="display:none;" class="note-area">
            <b>Catatan:</b><br>
            <span id="struk-note-text"></span>
        </div>

        <div class="text-center" style="margin-top:15px; border-top: 1px dashed black; padding-top: 5px;">
            <p style="margin:0;">Terima Kasih!</p>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwt-ySg3pW9CWH4cqFcp83CVVOf4oEDo8MPOI-o6SqpfWO6aN__uKkz3L2VEz1U6upc0Q/exec'; 

        let keranjang = [];

        function formatRupiah(n) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n);
        }

        function cekLayanan() {
            const layanan = document.getElementById('inputLayanan').value;
            const hargaEl = document.getElementById('inputHarga');
            const boxManual = document.getElementById('box-manual');

            if(layanan === 'Lainnya') {
                boxManual.style.display = 'block';
                document.getElementById('nama-manual').focus();
                hargaEl.value = 0;
            } else {
                boxManual.style.display = 'none';
                // Penyesuaian harga otomatis berdasarkan pilihan
                if(layanan.includes('Cuci')) hargaEl.value = 5000;
                else if(layanan.includes('Setrika')) hargaEl.value = 3000;
                else if(layanan === 'Bed Cover') hargaEl.value = 15000;
                else if(layanan === 'Sprei') hargaEl.value = 10000;
                else if(layanan === 'Permadani') hargaEl.value = 25000;
                else if(layanan === 'Jaket') hargaEl.value = 5000;
                else if(layanan === 'Boneka') hargaEl.value = 10000;
                else hargaEl.value = 0;
            }
        }

        function tambahItem() {
            let namaLayanan = document.getElementById('inputLayanan').value;
            const qty = parseFloat(document.getElementById('inputQty').value) || 0;
            const hargaSatuan = parseFloat(document.getElementById('inputHarga').value) || 0;
            let subtotal = 0;

            if (namaLayanan === 'Lainnya') {
                namaLayanan = document.getElementById('nama-manual').value;
                if(namaLayanan.trim() === "") { alert("Isi nama barang!"); return; }
            }

            if(qty <= 0 || hargaSatuan <= 0) { alert("Isi jumlah dan harga!"); return; }

            // --- LOGIKA PEMBULATAN KHUSUS ---
            // Menggunakan Math.floor untuk memisahkan berat bulat dan sisa (setengah kilo)
            const beratBulat = Math.floor(qty); 
            const sisaBerat = qty - beratBulat; 

            // Deteksi apakah layanan mengandung kata "Cuci" atau "Setrika"
            const isCuci = namaLayanan.toLowerCase().includes("cuci");
            const isSetrika = namaLayanan.toLowerCase().includes("setrika");

            if (sisaBerat > 0 && (isCuci || isSetrika)) {
                let hargaSisa = 0;
                if (isCuci) {
                    hargaSisa = 3000; // Jika Cuci, 0.5kg dihargai 3000
                } else if (isSetrika) {
                    hargaSisa = 2000; // Jika Setrika saja, 0.5kg dihargai 2000
                }
                subtotal = (beratBulat * hargaSatuan) + hargaSisa;
            } else {
                // Hitungan normal untuk berat bulat atau layanan non-kiloan
                subtotal = qty * hargaSatuan;
            }

            keranjang.push({ 
                layanan: namaLayanan, 
                qty: qty, 
                harga: hargaSatuan, 
                subtotal: subtotal 
            });
            
            renderKeranjang();
            // Reset qty ke 1 setelah tambah
            document.getElementById('inputQty').value = 1;
        }

        function renderKeranjang() {
            const tbody = document.getElementById('cartBody');
            tbody.innerHTML = '';
            keranjang.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.layanan}</td>
                        <td style="text-align:center;">${item.qty}</td>
                        <td style="text-align:right;">${formatRupiah(item.subtotal)}</td>
                        <td style="text-align:center;"><button class="btn-del" onclick="hapusItem(${index})">X</button></td>
                    </tr>`;
            });
            hitungTotalAkhir();
        }

        function hapusItem(index) {
            keranjang.splice(index, 1);
            renderKeranjang();
        }

        function hitungTotalAkhir() {
            let totalBelanja = keranjang.reduce((sum, item) => sum + item.subtotal, 0);
            let deposit = parseFloat(document.getElementById('inputDeposit').value) || 0;
            let utang = parseFloat(document.getElementById('inputUtang').value) || 0;
            
            let totalAkhir = (totalBelanja - deposit) + utang;

            document.getElementById('txtSubtotal').innerText = formatRupiah(totalBelanja);
            document.getElementById('txtTotalAkhir').innerText = formatRupiah(totalAkhir);
        }

        function prosesTransaksi() {
            const nama = document.getElementById('nama').value;
            const catatan = document.getElementById('inputNote').value;
            
            if(keranjang.length === 0) { alert("Keranjang kosong!"); return; }

            const containerStruk = document.getElementById('struk-items-container');
            containerStruk.innerHTML = ''; 
            let totalBelanja = 0;
            let listLayanan = [];

            keranjang.forEach(item => {
                totalBelanja += item.subtotal;
                containerStruk.innerHTML += `
                    <div class="struk-item">
                        <div class="bold">${item.layanan}</div>
                        <div class="flex-between">
                            <span>${item.qty} x ${formatRupiah(item.harga).replace('Rp', '')}</span>
                            <span>${formatRupiah(item.subtotal)}</span>
                        </div>
                    </div>`;
                listLayanan.push(`${item.layanan} (${item.qty})`);
            });

            const deposit = parseFloat(document.getElementById('inputDeposit').value) || 0;
            const utang = parseFloat(document.getElementById('inputUtang').value) || 0;
            const sisa = (totalBelanja - deposit) + utang;

            document.getElementById('struk-date').innerText = new Date().toLocaleString();
            document.getElementById('struk-nama').innerText = nama || "Umum";
            document.getElementById('struk-subtotal').innerText = formatRupiah(totalBelanja);
            
            if(deposit > 0) {
                document.getElementById('row-dp-struk').style.display = 'flex';
                document.getElementById('struk-dp').innerText = "- " + formatRupiah(deposit);
            } else {
                document.getElementById('row-dp-struk').style.display = 'none';
            }

            if(utang > 0) {
                document.getElementById('row-utang-struk').style.display = 'flex';
                document.getElementById('struk-utang').innerText = "+ " + formatRupiah(utang);
            } else {
                document.getElementById('row-utang-struk').style.display = 'none';
            }

            if(catatan.trim() !== "") {
                document.getElementById('struk-note-area').style.display = 'block';
                document.getElementById('struk-note-text').innerText = catatan;
            } else {
                document.getElementById('struk-note-area').style.display = 'none';
            }

            document.getElementById('struk-grand-total').innerText = formatRupiah(sisa);

            const dataKirim = {
                nama: nama || "Umum",
                layanan: listLayanan.join(", "), 
                total_qty: keranjang.reduce((sum, i) => sum + i.qty, 0),
                total_harga: totalBelanja,
                deposit: deposit,
                utang: utang,
                catatan: catatan,
                sisa_bayar: sisa
            };

            kirimKeGoogle(dataKirim);
            window.print();
        }

        function kirimKeGoogle(dataJson) {
            const btn = document.getElementById('btnCetak');
            btn.disabled = true; btn.innerText = "Menyimpan...";
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST", mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dataJson)
            }).then(() => {
                btn.disabled = false; btn.innerText = "🖨️ Cetak Struk & Simpan";
                document.getElementById('statusMsg').style.display = 'block';
            });
        }
    </script>
</body>
</html>
